services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: pulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., target: api }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://pulse:${POSTGRES_PASSWORD:-pulse}@db:5432/pulse
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: 1
      LOG_LEVEL: info
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
